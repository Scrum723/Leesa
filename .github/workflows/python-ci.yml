# Lint + smoke tests for the LEESA Python agent / dashboard
name: Python CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8 pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint with flake8
        run: |
          # Fail on syntax errors / undefined names
          flake8 src dashboard run.py scripts tests --count --select=E9,F63,F7,F82 --show-source --statistics
          # Style warnings do not fail the build
          flake8 src dashboard run.py scripts tests --count --exit-zero --max-complexity=12 --max-line-length=120 --statistics

      - name: Smoke tests
        env:
          DRY_RUN: "true"
          DASHBOARD_HOST: "127.0.0.1"
          DASHBOARD_PORT: "8787"
        run: |
          pytest -q
