# Mark and close stale issues/PRs to keep the support queue clean
name: Stale

on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-stale: 60
          days-before-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          stale-issue-message: >
            This issue has been marked stale due to inactivity.
            Comment to keep it open, or it may be closed in 14 days.
          stale-pr-message: >
            This PR has been marked stale due to inactivity.
            Push or comment to keep it open.
          exempt-issue-labels: "security,pinned,in-progress"
          exempt-pr-labels: "security,pinned,in-progress"
