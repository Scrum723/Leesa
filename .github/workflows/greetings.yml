# Welcome first-time contributors / issue reporters
name: Greetings

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            Thanks for opening your first issue on **LEESA** (Doc Weather Social Media Liaison)!

            Please include:
            - What you expected vs what happened
            - Platform (X / Instagram / TikTok / YouTube / dashboard / Mac app)
            - Whether `DRY_RUN` is on
            - Relevant logs (redact tokens/secrets)

            Legal & policies: https://social-media-liaison-production.up.railway.app/legal
          pr-message: |
            Thanks for your first pull request to **LEESA**!

            Please make sure:
            - Secrets (`.env`, API tokens) are **not** committed
            - `Python CI` / lint passes
            - Describe how you tested (dry-run preferred)

            Welcome aboard — stay accurate, stay informed.
